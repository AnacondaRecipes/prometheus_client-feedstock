{% set name = "prometheus_client" %}
{% set version = "0.26.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 04a91bcf94e2cf74a44a1a874d651a2e853ed354b6e822f3b7487751465d5c2b

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<39]

requirements:
  host:
    - python
    - pip
    - setuptools >=77.0.0
  run:
    - python

test:
  source_files:
    - tests
  imports:
    - prometheus_client
    - prometheus_client.bridge
    - prometheus_client.openmetrics
    - prometheus_client.twisted
  commands:
    - pip check
    - pytest tests -vv --ignore=tests/test_multiprocess.py  # [win]
    - pytest tests -vv  # [not win]
  requires:
    - pip
    - pytest
    - twisted
    - asgiref
    - pytest-benchmark

about:
  home: https://github.com/prometheus/client_python
  summary: Python client for the Prometheus monitoring system.
  license: Apache-2.0
  license_family: Apache
  license_file:
    - LICENSE
    - NOTICE
  dev_url: https://github.com/prometheus/client_python
  doc_url: https://github.com/prometheus/client_python#readme
  description: The official Python client for Prometheus.

extra:
  recipe-maintainers:
    - jessicaaustin
    - kwilcox
    - ocefpaf
